[project]
name = "internship_research_demo"
version = "0.1.0"
description = "internship_research_demo using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.3"
]

[project.scripts]
kickoff = "internship_research_demo.main:kickoff"
run_crew = "internship_research_demo.main:kickoff"
plot = "internship_research_demo.main:plot"
run_with_trigger = "internship_research_demo.main:run_with_trigger"
internship-agent = "internship_research_demo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
