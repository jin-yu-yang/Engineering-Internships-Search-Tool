research_task:
  description: >
    Research current {season} internship opportunities for {student_status}.

    User-selected search constraints:
    - applied science or engineering field: {applied_field}
    - role keywords: {role_family}
    - candidate degree level: {degree_levels}
    - work location or region: {work_location}
    - acceptable work modes: {work_modes}
    - work authorization rule: {sponsorship_filter}
    - application status rule: {application_status_filter}
    - employment type rule: {employment_type_filter}
    - additional search keywords: {additional_keywords}

    Find more than {opportunity_count} candidates if possible, then filter
    down to the strongest matches. Use employer career pages or official job
    posts as primary evidence whenever possible. If CPT/OPT support is
    required, include only opportunities with direct CPT/OPT language or
    credible employer evidence that CPT/OPT is accepted for internships. If
    CPT/OPT support is not required, still capture work authorization language
    and visa risk.

    Treat application status as a hard eligibility filter. Do not include or
    rank any posting if the employer page says the application is closed,
    expired, filled, no longer accepting applications, or unavailable. If
    application status is unclear, verify against the official employer page
    before using it and mark the freshness evidence explicitly.

    Treat employment type as a hard eligibility filter. Search for internship,
    intern, co-op, or university internship postings only. Do not include New
    Grad, graduate program, full-time, permanent, returnship, rotational
    program, or long-term employment roles, even if they otherwise match the
    field.

    Treat degree level as an eligibility and ranking filter. Prefer postings
    whose minimum qualifications match {degree_levels}. If a posting is
    explicitly PhD-only, include it only when PhD students are selected. If a
    posting excludes the selected degree level, do not include it.

    For each candidate, capture:
    - company
    - role title
    - application or job URL
    - location or remote/hybrid status
    - why it fits {applied_field}
    - eligible degree level and evidence from the posting
    - evidence that the role is an internship/co-op rather than New Grad or full-time
    - CPT/OPT sponsorship or compatibility evidence, if relevant
    - evidence that the application is still open or accepting applications
    - application deadline or freshness signal if available
    - compensation, team, or technical scope if available
    - risks, caveats, or missing facts
    - source URLs used
  expected_output: >
    A structured research brief with at least {opportunity_count} qualified
    internship candidates and source URLs for every candidate. Clearly label
    direct CPT/OPT evidence, indirect evidence, or missing work-authorization
    evidence. Every candidate must include evidence that applications are
    still open or accepting submissions, evidence of degree-level fit, and
    evidence that the role is an internship rather than New Grad/full-time.
  agent: internship_researcher

ranking_report_task:
  description: >
    Use the research brief to create a ranked markdown report of the top
    {opportunity_count} {season} {applied_field} internship opportunities for
    {student_status}.

    User ranking priorities: {ranking_priorities}

    Ranking rules:
    - Apply the user's selected field, degree level, work location, work modes,
      and work authorization rule.
    - Do not rank New Grad, full-time, permanent, or long-term employment roles.
    - Do not rank closed, expired, filled, unavailable, or no-longer-accepting
      postings.
    - When CPT/OPT is required, prefer direct CPT/OPT evidence over indirect
      employer evidence.
    - Prefer current official postings over stale or third-party listings.
    - Prefer roles with clear {applied_field} responsibilities.
    - Penalize missing deadlines, unclear work authorization language, or
      postings that appear closed.

    Score each opportunity out of 100 using this rubric unless the user's
    ranking priorities strongly imply different weights:
    - 30 points: fit for {applied_field} and role keywords
    - 25 points: work authorization fit and CPT/OPT evidence
    - 15 points: confirmed open application status, freshness, and application clarity
    - 15 points: location and work-mode fit
    - 10 points: degree-level fit, technical depth, mentorship, or team quality
    - 5 points: compensation, brand signal, or career upside

    The report must include:
    - title
    - short methodology
    - ranked table with score out of 100
    - one section per opportunity with evidence, fit, CPT/OPT notes, risks,
      degree-level match, and next action
    - "Watchouts" section for uncertainty
    - source links
  expected_output: >
    A concise markdown report without code fences, ranking exactly
    {opportunity_count} internship opportunities. Every ranked item must
    include source links and a CPT/OPT evidence note.
  agent: ranking_analyst
  output_file: output/internship_report.md
